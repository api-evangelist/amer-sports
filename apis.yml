description: 'Amer Sports is a global group of premium sports and outdoor brands with Nordic roots and more than 75 years of history, employing roughly 15,400 people and selling products in over 100 countries. Its portfolio spans ten brands including Arc''teryx, Salomon, Wilson, Peak Performance, Atomic, Armada, ATEC, DeMarini, EvoShield and Louisville Slugger, covering technical apparel, footwear, winter sports, racquet sports and ball sports equipment. Amer Sports was added to the API Evangelist network as a portfolio company of Hongshan (formerly Sequoia Capital China). As a consumer sports and outdoor manufacturer it publishes a corporate and investor web presence and a security.txt contact, but no public developer portal, API documentation, or machine-readable API specification was found during enrichment.'
